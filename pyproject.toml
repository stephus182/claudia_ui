[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudia_ui"
version = "0.1.0"
description = "ClaudIA — AI trading assistant powered by ibkr_core_mcp"
requires-python = ">=3.11,<3.14"
dependencies = [
    "panel>=1.9",
    # Direct dependency, not transitive: claudia/panel_chart.py imports bokeh.plotting
    # itself to build the candlestick figure. It resolved for a while only because panel
    # requires it (bokeh<3.10,>=3.7.0 as of panel 1.9.3) — a panel release that dropped or
    # renamed that dependency would have broken the chart pane at import time. Floor matches
    # panel's own; no upper bound here, so panel stays the single place that caps it.
    "bokeh>=3.7",
    "anthropic>=0.28",
    # ibkr_core_mcp is installed separately: pip install -e ../ibkr_core_mcp
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    # <2 pin required: the SDK's own README (verified 2026-07-22) documents v2 as a
    # pre-release/alpha-beta line — "Do not use v2 in production" — and explicitly
    # recommends this exact bound until v2 stabilizes.
    "mcp>=1.27,<2",
    "requests>=2.31",
    "html2text>=2024.2",
]

[project.optional-dependencies]
voice = [
    "edge-tts>=6.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.3",
    # Direct test dependency, not transitive: tests/test_proposal_tools.py imports
    # jsonschema itself to validate claudia/proposal_tools.py's strict tool schemas
    # locally. It resolved for a while only because mcp requires it — an mcp release
    # that dropped or vendored that dependency would have broken the suite at import
    # time. Test-only: the Anthropic API is what enforces these schemas in production.
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["claudia*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires live IBKR gateway and credentials",
    "live_api: requires a live Anthropic API call and an API key; opt-in via CLAUDIA_LIVE_SCHEMA_CHECK=1",
    "real_flex_sync: test exercises the real Flex-sync decision function (autouse seam disabled)",
    "real_tv_connect: test exercises the real TradingView connect function (autouse seam disabled)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Historical verification probe scripts (D4/D7/watchdog), committed verbatim as run —
# evidence artifacts, not maintained code (see docs/probes/README.md, Task 5.6a review).
extend-exclude = ["docs/probes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "FA", "D"]
ignore = [
    "E501",  # line-too-long — ~160 pre-existing lines exceed 100 chars, mostly
             # docstrings/URLs/system-prompt text; revisit as a dedicated pass if prioritized

    # pydocstyle: "D" is enabled for the D1xx *coverage* rules only. Those are the ones
    # worth enforcing — the 2026-07-25 audit found 67 undocumented definitions, including
    # the three handlers that fire live orders and the SSRF boundary, and nothing in CI
    # could see them. The codes below are formatting opinions that conflict with this
    # codebase's house style (multi-paragraph docstrings that explain *why*, cite source
    # URLs, and open with a full-sentence summary). Enforcing them would mean ~118 edits
    # of pure churn across docstrings whose content is already correct.
    "D203",  # incompatible with D211 (ruff warns and drops it anyway)
    "D205",  # blank line required between summary and description
    "D209",  # multi-line closing quotes on their own line
    "D213",  # summary on the second line — the inverse of D212 and of the house style,
             # which opens on the first line; ruff warns if both are selected
    "D301",  # backslash in docstring requires a raw string
    "D400",  # summary must end with a period
    "D401",  # summary must be in imperative mood
    "D413",  # blank line required after the last section
    "D415",  # summary must end with punctuation
]

# RUF002 (ambiguous-unicode in docstrings) can't take an inline noqa — the comment would
# become literal docstring text. Both hits are correct typography (en-dash for a numeric
# range, × for a count), not encoding mistakes.
[tool.ruff.lint.per-file-ignores]
"claudia/order_flow.py" = ["RUF002"]
"tests/test_session_reporter.py" = ["RUF002"]
# Docstring coverage is enforced on the package, not the suite: test names are the
# documentation there, and the security regression tests all carry real docstrings anyway.
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["claudia", "tests"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

# The genuinely unstubbed third-party imports in claudia/ or tests/ (verified against the
# actual venv — mcp, ibkr_core_mcp, panel, and bokeh all ship py.typed, so
# ignore_missing_imports is not needed for them):
#   googleapiclient — no py.typed (verified 2026-07-21).
#   pandas          — ships no py.typed and pandas-stubs is not installed (verified
#                     2026-07-24, Task 10.1). claudia/panel_chart.py types the cache
#                     DataFrame it charts; the fixture DataFrames in tests do too.
#   jsonschema      — ships no py.typed and types-jsonschema is not installed (verified
#                     2026-07-27). Test-only import: tests/test_proposal_tools.py
#                     validates the strict proposal schemas locally.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "pandas", "pandas.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
