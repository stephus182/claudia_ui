name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit. The dependency floors float upward on purpose, so the
    # resolved tree can acquire a known vulnerability without a single commit landing here.
    #
    # Tuesday, where ibkr_core_mcp runs Monday: deliberately staggered, so a new advisory
    # against a shared dependency is seen once, triaged in the repo that owns the floor, and
    # then confirmed here a day later — rather than two red runs at the same minute saying
    # the same thing. Not drift; do not "align" it.
    - cron: "0 6 * * 2"

# Mirrors ibkr_core_mcp/.github/workflows/ci.yml step for step (aligned 2026-09-08) so both
# repos are held to one gate: ruff check, ruff format --check, mypy, pytest.
#
# ibkr_core_mcp is not on PyPI. It is checked out beside this repo and installed with the
# exact command CLAUDE.md § Dev Setup step 3 documents — strict editable mode from
# ../ibkr_core_mcp — so CI executes the documented instruction rather than a CI-only variant
# of it (a lazy editable install fails mypy; the trap is described in claudia/install_check.py,
# and tests/test_install_check.py runs here against a fresh snapshot). The [scraper] extra is
# deliberately not installed: every scraper import is lazy, no unit test exercises a web tool,
# and crawl4ai's install adds minutes to every run.

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: claudia_ui

    steps:
      - uses: actions/checkout@v5
        with:
          path: claudia_ui

      - uses: actions/checkout@v5
        with:
          repository: stephus182/ibkr_core_mcp
          path: ibkr_core_mcp

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            claudia_ui/pyproject.toml
            ibkr_core_mcp/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e "../ibkr_core_mcp" --config-settings editable_mode=strict

      - name: Show resolved versions of the UI stack
        # These have no upper bound in pyproject.toml on purpose, so pip always takes the
        # latest release. Printing them here puts the culprit next to a failing step instead
        # of requiring a bisection — and `tornado` is the one that serves the UI, so its
        # version is worth reading on every run (audit 2026-09-13, §0).
        run: pip show panel bokeh tornado holoviews hvplot param anthropic mcp 2>/dev/null | grep -E "^(Name|Version):"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        # Bare `mypy`, strict, over claudia/ and tests/ (pyproject `files`) — the same scope
        # and mode as ibkr_core_mcp's gate. The suite carried 80 errors until 2026-09-08.
        run: mypy

      - name: Test (pytest, unit only)
        run: pytest -m "not integration" -v

  # Gates 6 and 7 (docs/audits/2026-09-13-security-architecture-audit.md, "Proposed CI
  # design"). Each detects a failure class none of the four steps above can see.

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: claudia_ui

      - uses: actions/checkout@v5
        with:
          repository: stephus182/ibkr_core_mcp
          path: ibkr_core_mcp

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit
        working-directory: claudia_ui
        # Requirements mode: pip-audit resolves the tree with `pip install --dry-run
        # --report` in a throwaway venv and installs nothing. ibkr_core_mcp is audited from
        # the checkout beside this one, WITH [scraper] — even though the test job omits it
        # for speed — because [scraper] is what a real ClaudIA install carries (CLAUDE.md
        # Dev Setup step 3: without it all four web tools are dark), and an audit of a tree
        # nobody runs is not an audit.
        #
        # 19 packages in this tree exist only here — panel, bokeh, tornado, holoviews,
        # hvplot and the rest of the UI stack — and ibkr_core_mcp's own pip-audit never sees
        # them. `tornado` is the HTTP listener, which is why this job is not redundant with
        # the core's (audit 2026-09-13, §5.2).
        #
        # --strict: a dependency that cannot be audited is a failure, not a skip.
        # Ignores come only from security/pip-audit-ignores.txt, one reason and one re-check
        # date per line; a finding with a fixed release is never ignored — bump the floor.
        run: |
          printf '.[dev]\n../ibkr_core_mcp[scraper]\n' > /tmp/audit-requirements.txt
          IGNORES=$(sed 's/#.*//' security/pip-audit-ignores.txt | awk 'NF { printf "--ignore-vuln %s ", $1 }')
          pip-audit --strict --desc --vulnerability-service osv --progress-spinner off $IGNORES -r /tmp/audit-requirements.txt

  secret-scan:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the action diffs the pushed / PR range, which needs history

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pinned, and not at the action's default. Two reasons, one of which bit on the
          # first push carrying this job (run 34858125121, 2026-09-14): the action downloads
          # its binary at run time, and its hard-coded default 8.24.3 was returning HTTP 504
          # from the release CDN on both the current and the legacy org path, while 8.30.0
          # returned 200 — so the gate failed twice for a reason that had nothing to do with
          # this repository. The other reason is the one that matters longer: a security gate
          # whose scanner version is whatever the action happens to default to is not a
          # reproducible control, and an unreviewed scanner upgrade can change what it finds
          # in either direction. Bump deliberately.
          GITLEAKS_VERSION: "8.30.0"
